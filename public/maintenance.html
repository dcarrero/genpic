<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GenPic — En mantenimiento</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #FAF7F5;
            color: #2D2926;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }
        .container {
            text-align: center;
            max-width: 480px;
        }
        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #7A2D3B;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: bold;
            color: #2D2926;
            margin-bottom: 1rem;
        }
        p {
            font-size: 1rem;
            color: #6B5E57;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .badge {
            display: inline-block;
            background: #7A2D3B;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            letter-spacing: 0.5px;
        }
        .contact {
            margin-top: 2rem;
            font-size: 0.85rem;
            color: #A89E99;
        }
        .contact a { color: #7A2D3B; text-decoration: none; }
        .contact a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">GenPic</div>
        <h1>Estamos preparando algo especial</h1>
        <p>
            Nuestro servicio de retratos artísticos con IA estará disponible muy pronto.
            Estamos ultimando los detalles para ofrecerte la mejor experiencia.
        </p>
        <span class="badge">PRÓXIMAMENTE</span>
        <div class="contact">
            <a href="mailto:hello@example.com">hello@example.com</a>
        </div>
    </div>
</body>
</html>
